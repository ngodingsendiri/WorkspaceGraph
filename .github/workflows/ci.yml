name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  # AG-2 guard: tracked TEXT files must never carry CRLF again (the prettier
  # "Delete ␍" debt that made lint fail at 3342 warnings). Lint only covers
  # src/; this scans every tracked file and skips the intentional exceptions
  # (*.bat, binary assets). No deps needed — runs before npm ci finishes.
  crlf:
    name: CRLF Guard (AG-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:crlf

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run --coverage

  # R1-4: flakiness gate — the full suite runs TWICE back-to-back under the
  # same parallel worker pool. Cross-file races (shared fixtures, spawned MCP
  # child processes) surface as a non-deterministic failure on one of the two
  # runs; a single green run can no longer mask a race regression.
  test-flaky:
    name: Unit Tests (2x flaky check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:flaky

  # M9 (TST-3): cross-platform gate — Windows path handling + safeStorage +
  # native better-sqlite3 build only run on ubuntu otherwise; regressions
  # surface at release time when they are most expensive to fix.
  test-windows:
    name: Unit Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run

  # M9 (TST-4): dependency vulnerability scan — blocks on known high/critical
  # CVEs in the production dependency tree.
  audit:
    name: Security Audit (TST-4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Fail on high/critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Secret leak sweep — API keys must never reach renderer-facing files
        shell: bash
        run: |
          ! grep -rnE "(sk-[A-Za-z0-9]{20}|AIza[A-Za-z0-9_-]{30}|xai-[A-Za-z0-9]{20})" \
            src/preload/ src/renderer/ --include='*.ts' --include='*.tsx' \
          || { echo "::error::API key literal found in preload/renderer"; exit 1; }

  build:
    name: Build
    needs: [typecheck, lint, test, test-flaky]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: out/
          retention-days: 7