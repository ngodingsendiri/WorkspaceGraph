name: Release

# Build installers for a versioned tag and publish a GitHub Release with them.
#
# Trigger: push a semantic-version tag (v1.2.3). The tag SHOULD match the
# `version` field in package.json — electron-builder stamps the installer name
# with `${version}` (electron-builder.yml artifactName), so a mismatched tag
# would produce an installer whose name does not match the release.
#
# Platform notes:
#  - Windows: NSIS x64 per electron-builder.yml (win.target). No code-signing
#    certificate configured → the installer is unsigned (expected for OSS/dev
#    builds; wire WIN_CSC_LINK once a cert is available).
#  - macOS: DMG per electron-builder.yml. `mac.notarize: false` is set, so no
#    Apple Developer credentials are required. CSC_IDENTITY_AUTO_DISCOVERY is
#    disabled so the runner's local identities are never picked up — builds are
#    unsigned/ad-hoc. Arch follows the runner host (macos-latest); extend with
#    `--x64 --arm64` or `--universal` when dual-arch DMGs are needed.
#  - Artifacts are uploaded with --publish never, then attached to the release
#    in the final job (single release, artifacts from both OS jobs).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-win:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-win
          path: dist/*.exe
          retention-days: 30

  build-mac:
    name: Build macOS (DMG)
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: dist/*.dmg
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [build-win, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release with installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/installer-win/*
            artifacts/installer-mac/*
          generate_release_notes: true
