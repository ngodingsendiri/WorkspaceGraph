name: Release

# Build installers for a versioned tag and publish a GitHub Release with them.
#
# Trigger: push a semantic-version tag (v1.2.3). The tag SHOULD match the
# `version` field in package.json — electron-builder stamps the installer name
# with `${version}` (electron-builder.yml artifactName), so a mismatched tag
# would produce an installer whose name does not match the release.
#
# Platform notes:
#  - Windows: NSIS x64 per electron-builder.yml (win.target). Code signing is
#    automatic when the repo secrets WIN_CSC_LINK (base64 .pfx) and
#    WIN_CSC_KEY_PASSWORD exist; absent secrets → UNSIGNED installer (the
#    current state — the verified v1.0.0 trial shipped unsigned).
#  - macOS: DMG per electron-builder.yml. Signing uses CSC_LINK (base64 .p12)
#    + CSC_KEY_PASSWORD + CSC_NAME; notarization is flipped on per-run via
#    `-c.mac.notarize=true` only when APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD +
#    APPLE_TEAM_ID are all present (electron-builder.yml keeps `notarize: false`
#    so builds never fail on missing secrets). CSC_IDENTITY_AUTO_DISCOVERY is
#    disabled so the runner's local identities are never picked up. Missing
#    secrets leave CSC_LINK EMPTY — the build step unsets it first, because
#    electron-builder treats "" as a certificate path and crashes with
#    "<projectDir> not a file" (hit in the v1.1.0 trial). Arch: builds
#    BOTH x64 and arm64 DMGs (`--x64 --arm64`); each is named with ${arch}
#    (dmg.artifactName). `--universal` is the single-DMG alternative but merges
#    native modules across arches — kept separate per arch for reliability.
#  - Full signing/notarization setup guide: docs/RELEASE.md.
#  - Artifacts are uploaded with --publish never, then attached to the release
#    in the final job (single release, artifacts from both OS jobs).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-win:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    env:
      # Code signing (optional): empty secrets → unsigned build (default).
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - name: Verify Windows artifact (name pattern + minimum size)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          EXES=(dist/WorkspaceGraph-*.exe)
          [ ${#EXES[@]} -eq 1 ] || { echo "expected exactly 1 installer, got ${#EXES[@]}"; exit 1; }
          EXE="${EXES[0]}"
          case "$EXE" in
            *-setup.exe) echo "name OK: $EXE" ;;
            *) echo "unexpected installer name: $EXE"; exit 1 ;;
          esac
          SIZE=$(wc -c < "$EXE")
          echo "$EXE -> $SIZE bytes"
          [ "$SIZE" -ge 52428800 ] || { echo "installer too small: $EXE"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-win
          path: dist/*.exe
          retention-days: 30

  build-mac:
    name: Build macOS (DMG)
    runs-on: macos-latest
    env:
      # Never pick up runner-local identities — builds are unsigned/ad-hoc
      # unless CSC_LINK is provided.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Code signing (optional): CSC_LINK base64 .p12 + key password + identity
      # name. When the secrets are missing the env vars are EMPTY strings — the
      # build step unsets them first (electron-builder would otherwise treat ""
      # as a certificate path and crash with "<projectDir> not a file").
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_NAME: ${{ secrets.CSC_NAME }}
      # Notarization (optional): all three must be present for the run step to
      # flip `-c.mac.notarize=true`; otherwise the DMG stays un-notarized.
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Build macOS installers (x64 + arm64; notarizes when secrets present)
        shell: bash
        run: |
          # electron-builder's getCscLink() treats an EMPTY CSC_LINK as a real
          # value ("// allow to specify as empty string"), then importCertificate
          # resolves "" to the project dir → "<projectDir> not a file" crash
          # (hit in the v1.1.0 trial). Unset it so the env var is undefined →
          # ad-hoc unsigned build, same as when no secrets are configured.
          if [ -z "${CSC_LINK:-}" ]; then
            echo "CSC_LINK absent → unsetting signing env (ad-hoc unsigned build)"
            unset CSC_LINK CSC_KEY_PASSWORD CSC_NAME
          fi
          ARGS="--mac --x64 --arm64 --publish never"
          if [ -n "${APPLE_ID}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ] && [ -n "${APPLE_TEAM_ID}" ]; then
            echo "Apple secrets present → enabling notarization"
            ARGS="${ARGS} -c.mac.notarize=true"
          else
            echo "Apple secrets absent → building un-notarized DMGs"
          fi
          npx electron-builder ${ARGS}
      - name: Verify macOS artifacts (name pattern + size; stapler/spctl when notarized)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMGS=(dist/WorkspaceGraph-*.dmg)
          [ ${#DMGS[@]} -eq 2 ] || { echo "expected 2 DMGs (x64 + arm64), got ${#DMGS[@]}"; exit 1; }
          for d in "${DMGS[@]}"; do
            case "$d" in
              *-x64.dmg|*-arm64.dmg) echo "name OK: $d" ;;
              *) echo "unexpected DMG name: $d"; exit 1 ;;
            esac
            SIZE=$(wc -c < "$d")
            echo "$d -> $SIZE bytes"
            [ "$SIZE" -ge 52428800 ] || { echo "DMG too small: $d"; exit 1; }
          done
          if [ -n "${APPLE_ID}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ] && [ -n "${APPLE_TEAM_ID}" ]; then
            echo "Notarized build — verifying staple + Gatekeeper on each DMG"
            for d in "${DMGS[@]}"; do
              xcrun stapler validate "$d"
              MOUNT=$(mktemp -d)
              hdiutil attach "$d" -mountpoint "$MOUNT" -nobrowse -quiet
              APP=$(find "$MOUNT" -maxdepth 1 -name '*.app' -print -quit)
              if [ -z "$APP" ]; then
                echo "no .app inside $d"; hdiutil detach "$MOUNT" -quiet; exit 1
              fi
              spctl -a -vv "$APP"
              hdiutil detach "$MOUNT" -quiet
            done
          else
            echo "Un-notarized build — skipping stapler/spctl"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: dist/*.dmg
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [build-win, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # M8 INS-4: generate sha256 checksums for all artifacts before publishing
      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.dmg' \) -exec sha256sum {} \; | sed 's|artifacts/||' > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release with installers + checksums
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/installer-win/*
            artifacts/installer-mac/*
            artifacts/SHA256SUMS
        generate_release_notes: true
